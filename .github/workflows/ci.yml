name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: MusteriYonetim

jobs:
  php:
    name: PHP (Pint, Larastan, Pest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.5'
          extensions: intl, zip, gd, pdo_sqlite
          coverage: pcov

      - name: Composer bağımlılıkları
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Ortam
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Güvenlik denetimi
        run: composer audit

      - name: Biçim (Pint)
        run: vendor/bin/pint --test

      - name: Statik analiz (Larastan seviye 6)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Testler
        run: php artisan test --parallel --coverage --min=80

  frontend:
    name: Ön yüz derlemesi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.5'
          extensions: intl, zip

      # Filament tema dosyası vendor/ içinden CSS içe aktarır.
      - run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: MusteriYonetim/package-lock.json

      - run: npm ci
      - run: npm run build
